name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: justclock
          POSTGRES_PASSWORD: justclock
          POSTGRES_DB: justclock
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test backend
        working-directory: backend
        env:
          DATABASE_URL: postgres://justclock:justclock@localhost:5432/justclock?sslmode=disable
          JWT_SECRET: test-secret-for-ci-only
          TSA_URL: mock
        run: |
          go run ./cmd/migrate
          go test ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Analyze and test
        working-directory: frontend
        run: |
          flutter pub get
          flutter analyze
          flutter test

