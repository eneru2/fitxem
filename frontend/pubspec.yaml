name: fitxem
description: Fitxem es una aplicación de fichaje digital legal para pymes españolas.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^10.3.1
  intl: ^0.20.2
  google_fonts: ^8.1.0
  flutter_svg: ^2.2.3
  geolocator: ^14.0.3
  permission_handler: ^11.4.0
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  table_calendar: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: assets/logo.png
  adaptive_icon_background: '#F5F5F5'
  adaptive_icon_foreground: assets/logo.png

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fitxem.svg
    - assets/logo.png
